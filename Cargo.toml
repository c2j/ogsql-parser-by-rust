[package]
name = "ogsql-parser"
version = "0.10.1"
edition = "2021"
rust-version = "1.71"
description = "A SQL parser for openGauss/GaussDB written in Rust"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["sql", "parser", "opengauss", "gaussdb", "database"]
categories = ["database", "parser-implementations"]
repository = "https://github.com/c2j/ogsql-parser"
include = [
    "src/**/*.rs",
    "Cargo.toml",
    "README.md",
    "LICENSE-MIT",
    "LICENSE-APACHE",
]

[dependencies]
thiserror = "2"
encoding_rs = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
phf = { version = "0.11", features = ["macros"] }
toml = { version = "0.8", optional = true }

# Binary-only deps (feature-gated)
clap = { version = "4", features = ["derive"], optional = true }
axum = { version = "0.8", features = ["multipart"], optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros"], optional = true }
tower-http = { version = "0.6", features = ["cors", "trace", "request-id"], optional = true }
utoipa = { version = "5", optional = true }
# Pinned to 9.0.0: 9.0.2 bumped `zip` to ^3.0.0 whose `dep:`-syntax features are
# unresolvable by older Cargo (incl. the MSRV toolchain), and 9.0.1's zip ^2.6
# has no non-yanked release (2.6.0/2.6.1 are yanked). 9.0.0's zip ^2 resolves to
# 2.4.2 and is API-compatible with utoipa 5 / axum 0.8.
utoipa-swagger-ui = { version = "=9.0.0", features = ["axum"], optional = true }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"], optional = true }
ratatui = { version = "0.29", optional = true }
crossterm = { version = "0.28", optional = true }
quick-xml = { version = "0.41", optional = true }
tree-sitter = { version = "0.24", optional = true }
tree-sitter-java = { version = "0.23", optional = true }
walkdir = { version = "2", optional = true }
rmcp = { version = "1.5", features = ["server", "macros", "transport-io", "schemars"], optional = true }
schemars = { version = "1", optional = true }

[features]
default = []
lint-config = ["dep:toml"]
cli = ["dep:clap", "dep:walkdir", "lint-config"]
ibatis = ["dep:quick-xml", "dep:walkdir"]
java = ["dep:tree-sitter", "dep:tree-sitter-java", "dep:walkdir"]
serve = ["cli", "dep:axum", "dep:tokio", "dep:tower-http", "dep:utoipa", "dep:utoipa-swagger-ui", "dep:tracing", "dep:tracing-subscriber"]
serve-minimal = ["cli", "dep:axum", "dep:tokio", "dep:tower-http", "dep:utoipa", "dep:tracing", "dep:tracing-subscriber"]
utoipa-swagger-ui = ["dep:utoipa-swagger-ui"]
tui = ["cli", "dep:ratatui", "dep:crossterm"]
mcp = ["dep:rmcp", "dep:schemars", "dep:tokio", "ibatis", "java"]
full = ["cli", "ibatis", "java", "mcp", "serve", "tui"]

[[bin]]
name = "ogsql"
path = "src/bin/ogsql.rs"
required-features = ["cli"]

[[bin]]
name = "ogsql-mcp"
path = "src/bin/ogsql-mcp.rs"
required-features = ["mcp"]

[[bin]]
name = "sqlsmith-harness"
path = "tests/sqlsmith/sqlsmith_harness.rs"
required-features = ["cli"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints.clippy]
unwrap_used = "warn"

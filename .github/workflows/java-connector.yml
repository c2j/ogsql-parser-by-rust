# Java connector: build platform binaries, run connector tests, assemble the
# fat jar, publish to GitHub Packages (tag / manual) and optionally Maven
# Central (manual only).

name: Java Connector

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "java-connector/**"
      - "Cargo.toml"
      - ".github/workflows/java-connector.yml"
  workflow_dispatch:
    inputs:
      deploy_github:
        description: "Deploy fat jar to GitHub Packages"
        type: boolean
        default: false
      deploy_central:
        description: "Deploy fat jar to Maven Central (Central Portal)"
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── 1. Build `ogsql serve-stdio` (--features cli only) for every supported platform ──
  platform-binaries:
    name: Build ogsql (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            zigbuild: "true"
            resource: ogsql_linux_amd64
            suffix: ""
          - name: linux-arm64
            os: ubuntu-22.04
            target: aarch64-unknown-linux-gnu
            zigbuild: "true"
            resource: ogsql_linux_arm64
            suffix: ""
          - name: osx-amd64
            os: macos-14
            target: x86_64-apple-darwin
            zigbuild: "false"
            resource: ogsql_osx_amd64
            suffix: ""
          - name: osx-arm64
            os: macos-14
            target: aarch64-apple-darwin
            zigbuild: "false"
            resource: ogsql_osx_arm64
            suffix: ""
          - name: windows-amd64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            zigbuild: "false"
            resource: ogsql_windows_amd64.exe
            suffix: ".exe"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Zig (linux cross)
        if: matrix.zigbuild == 'true'
        uses: mlugg/setup-zig@v1
        with:
          version: "0.13.0"
      - name: Install cargo-zigbuild (linux cross)
        if: matrix.zigbuild == 'true'
        run: cargo install cargo-zigbuild
      - name: Build
        shell: bash
        run: |
          if [ "${{ matrix.zigbuild }}" = "true" ]; then
            cargo zigbuild --release --features cli --target ${{ matrix.target }}
          else
            cargo build --release --features cli --target ${{ matrix.target }}
          fi
      - name: Stage resource-named binary
        shell: bash
        run: |
          mkdir -p staged
          cp "target/${{ matrix.target }}/release/ogsql${{ matrix.suffix }}" \
            "staged/${{ matrix.resource }}"
          ls -la staged/
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.resource }}
          path: staged/${{ matrix.resource }}

  # ── 2. Connector test suite against a freshly built local binary ──
  java-test:
    name: Java connector tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - uses: dtolnay/rust-toolchain@stable
      - name: Build local binary
        run: cargo build --features cli
      - name: Run connector tests
        run: mvn -B -f java-connector/pom.xml test

  # ── 3. Assemble the DuckDB-style fat jar (binaries inside resources) ──
  java-package:
    name: Package jar (all platforms)
    runs-on: ubuntu-latest
    needs: platform-binaries
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - uses: actions/download-artifact@v4
        with:
          path: native-binaries
          merge-multiple: true
      - name: Copy platform binaries into resources
        run: |
          echo "=== native-binaries layout ==="
          find native-binaries -maxdepth 3 -type f -print | sort || true
          ls -la native-binaries || true
          mkdir -p java-connector/src/main/resources
          missing=0
          for f in ogsql_linux_amd64 ogsql_linux_arm64 ogsql_osx_amd64 ogsql_osx_arm64 ogsql_windows_amd64.exe; do
            if [ -f "native-binaries/$f" ]; then
              cp "native-binaries/$f" java-connector/src/main/resources/
            else
              echo "::error::missing platform binary $f"
              missing=1
            fi
          done
          chmod +x java-connector/src/main/resources/ogsql_* 2>/dev/null || true
          ls -la java-connector/src/main/resources/
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
      - name: Package jar
        run: mvn -B -f java-connector/pom.xml -DskipTests package
      - name: Assert fat jar embeds five platform binaries
        run: |
          shopt -s nullglob
          fat=()
          for j in java-connector/target/ogsql-parser-java-*.jar; do
            case "$j" in
              *-sources.jar|*-javadoc.jar) ;;
              *) fat+=("$j") ;;
            esac
          done
          if [ "${#fat[@]}" -ne 1 ]; then
            echo "expected exactly one main jar, found: ${fat[*]}" >&2
            ls -la java-connector/target || true
            exit 1
          fi
          bash java-connector/scripts/assert-fat-jar.sh "${fat[0]}"
      - uses: actions/upload-artifact@v4
        with:
          name: ogsql-parser-java-jar
          path: java-connector/target/ogsql-parser-java-*.jar
      - name: Smoke parse without external binary (linux-amd64)
        run: |
          FAT=""
          for j in java-connector/target/ogsql-parser-java-*.jar; do
            case "$j" in
              *-sources.jar|*-javadoc.jar) ;;
              *) FAT="$j" ;;
            esac
          done
          mvn -B -f java-connector/pom.xml -DincludeScope=runtime \
            -DoutputDirectory=/tmp/ogsql-rt \
            org.apache.maven.plugins:maven-dependency-plugin:3.7.1:copy-dependencies
          cat > /tmp/FatSmoke.java <<'EOF'
          import io.github.c2j.ogsql.*;
          public class FatSmoke {
            public static void main(String[] args) {
              try (Ogsql o = Ogsql.newInstance()) {
                ParseResult r = o.parse("SELECT 1 FROM dual", false);
                if (r.errorCount() != 0) throw new RuntimeException("errors: " + r.errors());
                if (r.statementCount() < 1) throw new RuntimeException("no statements");
                System.out.println("ok version=" + o.version());
              }
            }
          }
          EOF
          CP="$FAT"
          for j in /tmp/ogsql-rt/*.jar; do
            CP="$CP:$j"
          done
          javac --release 11 -cp "$CP" /tmp/FatSmoke.java -d /tmp
          java -cp "/tmp:$CP" FatSmoke

  # ── 4a. GitHub Packages (required channel: tags + manual) ──
  java-deploy-github:
    name: Deploy fat jar to GitHub Packages
    if: >
      (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_github == 'true')
      || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    needs: [platform-binaries]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - uses: actions/download-artifact@v4
        with:
          path: native-binaries
          merge-multiple: true
      - name: Copy platform binaries into resources
        run: |
          echo "=== native-binaries layout ==="
          find native-binaries -maxdepth 3 -type f -print | sort || true
          mkdir -p java-connector/src/main/resources
          missing=0
          for f in ogsql_linux_amd64 ogsql_linux_arm64 ogsql_osx_amd64 ogsql_osx_arm64 ogsql_windows_amd64.exe; do
            if [ -f "native-binaries/$f" ]; then
              cp "native-binaries/$f" java-connector/src/main/resources/
            else
              echo "::error::missing platform binary $f"
              missing=1
            fi
          done
          chmod +x java-connector/src/main/resources/ogsql_* 2>/dev/null || true
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
      - name: Package and assert fat jar
        run: |
          mvn -B -f java-connector/pom.xml -DskipTests package
          FAT=""
          for j in java-connector/target/ogsql-parser-java-*.jar; do
            case "$j" in
              *-sources.jar|*-javadoc.jar) ;;
              *) FAT="$j" ;;
            esac
          done
          bash java-connector/scripts/assert-fat-jar.sh "$FAT"
      - name: Configure Maven for GitHub Packages
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<EOF
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0">
            <servers>
              <server>
                <id>github</id>
                <username>${GITHUB_ACTOR}</username>
                <password>${GITHUB_TOKEN}</password>
              </server>
            </servers>
          </settings>
          EOF
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Deploy
        run: |
          set +e
          mvn -B -f java-connector/pom.xml -Pgithub deploy -DskipTests | tee /tmp/github-deploy.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -eq 0 ]; then
            exit 0
          fi
          if grep -q 'status code: 409' /tmp/github-deploy.log; then
            echo "GitHub Packages already has this non-SNAPSHOT version; leaving it in place."
            exit 0
          fi
          exit "$status"

  # ── 4b. Maven Central (manual only) ──
  # Secrets: SONATYPE_USERNAME / SONATYPE_PASSWORD, GPG_PRIVATE_KEY,
  # GPG_PASSPHRASE, GPG_KEY_ID. See docs/java-developer-guide.md §3.1.
  java-deploy-central:
    name: Deploy fat jar to Maven Central
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_central == 'true'
    runs-on: ubuntu-latest
    needs: [platform-binaries]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - uses: actions/download-artifact@v4
        with:
          path: native-binaries
          merge-multiple: true
      - name: Copy platform binaries into resources
        run: |
          echo "=== native-binaries layout ==="
          find native-binaries -maxdepth 3 -type f -print | sort || true
          mkdir -p java-connector/src/main/resources
          missing=0
          for f in ogsql_linux_amd64 ogsql_linux_arm64 ogsql_osx_amd64 ogsql_osx_arm64 ogsql_windows_amd64.exe; do
            if [ -f "native-binaries/$f" ]; then
              cp "native-binaries/$f" java-connector/src/main/resources/
            else
              echo "::error::missing platform binary $f"
              missing=1
            fi
          done
          chmod +x java-connector/src/main/resources/ogsql_* 2>/dev/null || true
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
      - name: Package and assert fat jar
        run: |
          mvn -B -f java-connector/pom.xml -DskipTests package
          FAT=""
          for j in java-connector/target/ogsql-parser-java-*.jar; do
            case "$j" in
              *-sources.jar|*-javadoc.jar) ;;
              *) FAT="$j" ;;
            esac
          done
          bash java-connector/scripts/assert-fat-jar.sh "$FAT"
      - name: Import GPG key
        run: |
          mkdir -p ~/.gnupg
          chmod 700 ~/.gnupg
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | base64 -d | gpg --batch --import -
          gpg --list-secret-keys
      - name: Configure Maven for Central Portal
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<EOF
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0">
            <servers>
              <server>
                <id>central</id>
                <username>${SONATYPE_USERNAME}</username>
                <password>${SONATYPE_PASSWORD}</password>
              </server>
            </servers>
          </settings>
          EOF
        env:
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
      - name: Deploy to Maven Central
        run: mvn -B -f java-connector/pom.xml -Pcentral deploy -DskipTests \
          -Dgpg.keyname=${{ secrets.GPG_KEY_ID }} \
          -Dgpg.passphrase=${{ secrets.GPG_PASSPHRASE }}

  # ── 5. Attach the same fat jar to the GitHub Release on tags ──
  java-release-asset:
    name: Attach fat jar to GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: java-package
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ogsql-parser-java-jar
          path: dist
      - name: Attach jar to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          fail_on_unmatched_files: true
          files: |
            dist/ogsql-parser-java-*.jar
